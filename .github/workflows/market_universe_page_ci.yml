name: Check market-wide instrument search page
on:
  push:
    branches: [feature/market-wide-universe-20261014]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  ui:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: python -m unittest discover -s tests -p test_market_universe_page.py -v
      - name: Validate mobile client JS syntax
        run: |
          python - <<'PY'
          import re
          from pathlib import Path
          page=Path('market_universe.html').read_text('utf-8')
          src=re.findall(r'<script>(.*?)</script>',page,re.S)
          assert len(src)==1
          Path('/tmp/market.js').write_text(src[0],encoding='utf-8')
          PY
          node --check /tmp/market.js
