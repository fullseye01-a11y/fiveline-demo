name: Probe licensed government fund NAV sources
on:
  push:
    branches:
      - feature/official-open-nav-probe-20261013
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Verify CSV parsing and no-write behavior
        run: python -m unittest discover -s backend/tests -v
  external_probe:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Probe SITCA public daily NAV
        run: |
          python -m backend.providers.open_fund_nav sitca_domestic_daily || echo "SITCA source needs access/schema review (no data published)"
      - name: Probe TDCC public offshore global NAV
        run: |
          python -m backend.providers.open_fund_nav tdcc_offshore_global || echo "TDCC source needs access/schema review (no data published)"
