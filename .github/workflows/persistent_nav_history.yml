name: Preserve public official NAV snapshots
on:
  push:
    branches: [main]
    paths:
      - .github/workflows/persistent_nav_history.yml
  schedule:
    # 21:55 Asia/Taipei, Monday-Friday. May be delayed by GitHub.
    - cron: "55 13 * * 1-5"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: fiveline-public-gov-nav-archive
  cancel-in-progress: false

jobs:
  archive:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          path: application
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          ref: official-nav-history
          path: nav_history_branch
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build immutable open-data snapshot, not approved NAV history
        working-directory: application
        env:
          GITHUB_RUN_ID: ${{ github.run_id }}
        run: python -m tools.public_nav_history --output-dir ../nav_history_branch/public_nav_history
      - name: Verify duplicates, effective NAV dates and fund identity quality
        working-directory: application
        run: |
          python -m tools.audit_public_nav_quality --snapshots ../nav_history_branch/public_nav_history --coverage data/phase16_instrument_coverage.csv --output ../nav_history_branch/public_nav_history/reports/latest.json
          python - <<'PY'
          import json
          d=json.load(open('../nav_history_branch/public_nav_history/reports/latest.json',encoding='utf-8'))
          assert d['approved_funds']==0 and not d['historical_backfill_completed']
          assert d['calendar_span_is_not_missing_trading_days']
          print('NAV quality:',d['archive_snapshot_files'],'archives;',
                d['unique_fund_effective_date_pairs'],'distinct NAV effective days;',
                d['repeated_collection_observations'],'repeated captures')
          PY
      - name: Evaluate 68-fund preflight (public observations only, zero approvals)
        working-directory: application
        run: |
          python -m tools.nav_backfill_preflight --quality ../nav_history_branch/public_nav_history/reports/latest.json --coverage data/phase16_instrument_coverage.csv --output ../nav_history_branch/public_nav_history/reports/backfill_preflight.json
          python - <<'PY'
          import json
          from pathlib import Path
          p=Path('../nav_history_branch/public_nav_history/reports/backfill_preflight.json')
          r=json.loads(p.read_text('utf-8'))
          assert r['legacy_total']==68 and len(r['funds'])==68
          assert r['staging_eligible_count']==0
          assert all(x['status']=='blocked' and not x['eligible_for_production_backfill'] for x in r['funds'])
          assert not r['production_backfill_authorized']
          assert not r['production_excel_changed']
          assert not r['evidence_submitted']
          print('Historical NAV backfill blocked for all 68 without independently reviewed evidence')
          PY
      - name: Append to official-nav-history branch only
        working-directory: nav_history_branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public_nav_history/
          if git diff --cached --quiet; then
            echo "No new snapshot to archive"
          else
            git commit -m "Archive public government NAV candidates for run ${{ github.run_id }}"
            git push origin HEAD:official-nav-history
          fi
      - name: Rebuild temporary SQLite from versioned evidence (fail on NAV revision)
        working-directory: application
        run: |
          python -m tools.rebuild_public_nav_sqlite --snapshots ../nav_history_branch/public_nav_history --output ../daily_public_nav_readonly.sqlite
          python - <<'PY'
          import sqlite3
          db=sqlite3.connect('../daily_public_nav_readonly.sqlite')
          funds=db.execute("select count(*) from official_funds where approval_status='UNAPPROVED'").fetchone()[0]
          observations=db.execute("select count(*) from nav_raw_history where identity_review='PENDING'").fetchone()[0]
          assert funds>0 and observations>0
          assert db.execute("select count(*) from official_funds where approval_status!='UNAPPROVED'").fetchone()[0]==0
          print('Unapproved public funds:',funds,'dated raw observations:',observations)
          PY
      - name: Upload disposable SQLite materialized view
        uses: actions/upload-artifact@v4
        with:
          name: public-nav-staging-sqlite-${{ github.run_id }}
          path: daily_public_nav_readonly.sqlite
          retention-days: 30
          if-no-files-found: error
